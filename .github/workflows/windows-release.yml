name: Windows Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    name: Release / tests-first
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SchoolObservatory.sln
      - run: dotnet build SchoolObservatory.sln --configuration Release --no-restore -warnaserror
      - run: dotnet test SchoolObservatory.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=release-tests.trx"
      # Before publishing any distribution, verify the native SQLCipher-compatible engine
      # and backup/restore regressions under BOTH Windows process architectures.
      - name: Native SQLCipher x86 and x64 recovery smoke tests
        shell: pwsh
        run: |
          foreach ($arch in @('x86','x64')) {
            dotnet test tests/SchoolObservatory.Tests/SchoolObservatory.Tests.csproj --configuration Release --arch $arch --filter "FullyQualifiedName~DatabaseSecurityPhase1Tests" --logger "trx;LogFileName=security-$arch.trx"
            if ($LASTEXITCODE -ne 0) { throw "Native $arch encryption/recovery tests failed: packaging forbidden" }
          }

  build-packages:
    name: Release / package-${{ matrix.arch }}
    runs-on: windows-latest
    needs: release-tests
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained portable
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          dotnet publish src/SchoolObservatory.Desktop/SchoolObservatory.Desktop.csproj -c Release -r "win-$arch" --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "artifacts/publish/$arch"
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (!(Test-Path "artifacts/publish/$arch/SchoolObservatory.exe")) { throw 'Executable missing' }
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          Compress-Archive -Path "artifacts/publish/$arch/*" -DestinationPath "artifacts/packages/SchoolObservatory-$arch-Portable.zip" -Force
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build installer
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $publish = (Resolve-Path "artifacts/publish/$arch").Path
          & $iscc "/DAppArch=$arch" "/DPublishDir=$publish" "installer/SchoolObservatory.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          if (!(Test-Path "artifacts/installers/SchoolObservatory-$arch-Installer.exe")) { throw 'Installer missing' }
      - name: Archive release deliverables
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          Copy-Item "artifacts/installers/SchoolObservatory-$arch-Installer.exe" "artifacts/packages/"
          Get-FileHash "artifacts/packages/SchoolObservatory-$arch-Portable.zip" -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } | Out-File -FilePath "artifacts/packages/SHA256-$arch.txt" -Encoding utf8
          Get-FileHash "artifacts/packages/SchoolObservatory-$arch-Installer.exe" -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } | Out-File -FilePath "artifacts/packages/SHA256-$arch.txt" -Append -Encoding utf8
      # Each deliverable is a separate artifact; do not bundle an .exe with its Portable ZIP.
      - name: Upload standalone Portable download
        uses: actions/upload-artifact@v4
        with:
          name: school-observatory-${{ matrix.arch }}-portable
          path: artifacts/packages/SchoolObservatory-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload standalone Installer download
        uses: actions/upload-artifact@v4
        with:
          name: school-observatory-${{ matrix.arch }}-installer
          path: artifacts/packages/SchoolObservatory-${{ matrix.arch }}-Installer.exe
          if-no-files-found: error
          compression-level: 0

  verify-four-outputs:
    name: Release / verify-all-4
    runs-on: windows-latest
    needs: build-packages
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: school-observatory-*-*
          merge-multiple: true
          path: release
      - name: Require two portable and two installers
        shell: pwsh
        run: |
          $expected = @(
            'SchoolObservatory-x86-Portable.zip',
            'SchoolObservatory-x86-Installer.exe',
            'SchoolObservatory-x64-Portable.zip',
            'SchoolObservatory-x64-Installer.exe'
          )
          foreach ($name in $expected) {
            $item = Get-Item "release/$name" -ErrorAction Stop
            if ($item.Length -lt 500000) { throw "Unexpectedly small/corrupted distribution: $name" }
            $stream = [System.IO.File]::OpenRead($item.FullName)
            try {
              $header = New-Object byte[] 4
              [void]$stream.Read($header, 0, 4)
              if ($name.EndsWith('.exe') -and ($header[0] -ne 0x4d -or $header[1] -ne 0x5a)) {
                throw "Invalid Windows EXE header: $name"
              }
              if ($name.EndsWith('.zip') -and ($header[0] -ne 0x50 -or $header[1] -ne 0x4b)) {
                throw "Invalid ZIP header: $name"
              }
            } finally { $stream.Dispose() }
          }
          $zipFiles = Get-ChildItem release -Filter '*-Portable.zip'
          Add-Type -AssemblyName System.IO.Compression
          foreach ($zip in $zipFiles) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
            try {
              if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'SchoolObservatory.exe' })) {
                throw "Portable download lacks SchoolObservatory.exe: $($zip.Name)"
              }
            } finally { $archive.Dispose() }
          }
          if ((Get-ChildItem release -File).Count -ne 4) { throw 'Expected exactly four standalone downloads.' }
          Get-ChildItem release | Select-Object Name,Length
